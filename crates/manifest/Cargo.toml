[package]
name = "nectar-manifest"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
description = "Manifest seam for Ethereum Swarm: one trait over the trie and key-value manifest formats"
documentation = "https://docs.rs/nectar-manifest"
readme = "README.md"
keywords = ["swarm", "ethereum", "manifest", "no_std", "trait"]
categories = ["data-structures", "no-std", "asynchronous"]

[lints]
workspace = true

[dependencies]
auto_impl = { workspace = true }
derive_more = { workspace = true }
futures-util = { workspace = true }
nectar-marker = { workspace = true }
# Reference, ChunkRef and the boxed-error alias the erased seam reports
# through.
nectar-primitives = { workspace = true }
nectar-tasks = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
bytes.workspace = true
nectar-primitives = { workspace = true, features = ["std"] }
nectar-testing = { workspace = true, features = ["bench"] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
# Path-only: each depends on this crate, so a versioned dev-dependency would
# have no publish order.
nectar-file = { path = "../file" }
nectar-ldb = { path = "../ldb", features = ["manifest"] }
nectar-mantaray = { path = "../mantaray", features = ["manifest"] }

[features]
default = [ "std" ]
std = [
	"futures-util/std",
	"nectar-primitives/std",
	"nectar-tasks/std",
	"thiserror/std",
]
# A dev shape, not a capability: the seam holds no crypto, so this is not
# `encryption` and must never be named as one.
test-encryption = [
	"nectar-file/encryption",
	"nectar-ldb/encryption",
	"nectar-mantaray/encryption",
	"nectar-primitives/encryption",
]
# Single-thread send escape: relaxes the boxed manifest futures off `Send` in
# lockstep with the store traits.
unsync = [
	"nectar-file/unsync",
	"nectar-ldb/unsync",
	"nectar-mantaray/unsync",
	"nectar-marker/unsync",
	"nectar-primitives/unsync",
	"nectar-tasks/unsync",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# An example, not a bench: a bench target cannot be run for its JSON document.
[[example]]
name = "manifest-perf"
path = "examples/manifest-perf/main.rs"
test = true
