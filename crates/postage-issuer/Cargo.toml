[package]
name = "nectar-postage-issuer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
description = "Postage stamp issuing and signing for Ethereum Swarm"
documentation = "https://docs.rs/nectar-postage-issuer"
readme = "README.md"
keywords = ["swarm", "ethereum", "postage", "signing"]
categories = ["cryptography", "data-structures"]

[lints]
workspace = true

[dependencies]
nectar-clock = { workspace = true }
nectar-kernel = { workspace = true }
nectar-marker = { workspace = true }
nectar-postage = { workspace = true }
nectar-primitives = { workspace = true }
alloy-primitives = { workspace = true }
thiserror = { workspace = true }

# optional
# The signer stack requires std; the no_std core only allocates digests.
alloy-signer = { workspace = true, optional = true }
alloy-signer-local = { workspace = true, optional = true }
futures-channel = { workspace = true, optional = true }
futures-core = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
nectar-tasks = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }

[dev-dependencies]
# Referenced by the `arbitrary` feature; the decorator regression splits
# through the streaming engine.
nectar-file = { workspace = true, features = ["std"] }
nectar-testing = { workspace = true }
# The upload pipeline bench splits through the streaming engine and the
# rayon batch ingest.
proptest = { workspace = true }
rand = { workspace = true }
alloy-signer-local = { workspace = true }
alloy-primitives = { workspace = true, features = ["getrandom"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[features]
default = [ "std" ]

# Standard library support: the signer stack, the concurrent issuers
# (sharded, sharded ring), the factory and the dilution registry live behind
# this gate.
std = [
	"dep:alloy-signer",
	"dep:futures-core",
	"dep:futures-util",
	"dep:nectar-tasks",
	"nectar-clock/std",
	"nectar-postage/std",
	"nectar-primitives/std",
	"nectar-tasks/rayon",
	"nectar-tasks/std",
]

# Local key signing for testing and development
local-signer = [ "dep:alloy-signer-local", "std" ]

# The pipeline's parallel signing engine using rayon. Rayon on wasm32 or
# under `unsync` is a compile error, never a silent fallback.
parallel = [
	"dep:futures-channel",
	"dep:rayon",
	"nectar-postage/parallel",
	"nectar-primitives/parallel",
	"std",
]

# Single-thread send escape: relaxes the signer bounds in lockstep with the
# clock and primitives markers.
unsync = [
	"nectar-clock/unsync",
	"nectar-kernel/unsync",
	"nectar-marker/unsync",
	"nectar-primitives/unsync",
	"nectar-tasks?/unsync",
]

# Arbitrary trait implementations for property-based testing
arbitrary = [
	"nectar-file/arbitrary",
	"nectar-postage/arbitrary",
	"nectar-primitives/arbitrary",
	"std",
]

# `parallel` and `unsync` are mutually exclusive, so the doc build lists
# features explicitly rather than enabling all at once.
[package.metadata.docs.rs]
features = ["std", "local-signer", "parallel", "arbitrary"]
rustdoc-args = ["--cfg", "docsrs"]
