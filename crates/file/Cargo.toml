[package]
name = "nectar-file"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
description = "Streaming file pipeline for Ethereum Swarm: bounded chunk-tree reads and writes"
documentation = "https://docs.rs/nectar-file"
readme = "README.md"
keywords = ["swarm", "ethereum", "file", "streaming", "no_std"]
categories = ["no-std", "asynchronous", "data-structures"]

[lints]
workspace = true

[dependencies]
arbitrary = { workspace = true, optional = true }
bytes = { workspace = true, features = ["std"] }
futures-util = { workspace = true, features = ["std"] }
nectar-clock = { workspace = true, features = ["std"] }
nectar-governor = { workspace = true }
nectar-manifest = { workspace = true, optional = true }
nectar-marker = { workspace = true }
nectar-primitives = { workspace = true, features = ["std"] }
nectar-tasks = { workspace = true, features = ["std"] }
positioned-io = { workspace = true }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["sync"], optional = true }
zeroize = { workspace = true, optional = true }

[build-dependencies]

[dev-dependencies]
# The seed replay decodes committed fuzz inputs through the same grammar the
# fuzzer uses.
arbitrary.workspace = true
criterion.workspace = true
proptest.workspace = true
# The oracle stores and chunk fixtures ride the primitives store surface,
# including the encrypted reference width.
nectar-primitives = { workspace = true, features = ["arbitrary", "encryption", "std"] }
nectar-testing = { workspace = true, features = ["alloc", "fixtures"] }
tokio = { workspace = true, features = ["io-util", "time"] }

[features]
# The read/write pipeline and its buffers are unconditional; these features
# are the back-ends and modes stacked on top of that base.

# The manifest seam's shared data-load lane: one `load_reference` every
# format adapter calls.
manifest = [ "dep:nectar-manifest", "nectar-manifest?/std" ]

# Async reader adapter over the poll surface, plus the `AsyncRead` source.
tokio = [ "dep:tokio" ]

# Pool leaf hashing: the split hash window and the read-at ingest; rayon on
# wasm32 or under `unsync` is a compile error, never a silent fallback.
rayon = [ "nectar-tasks/rayon" ]

# The shared malformed-walk oracle, the structural-regime body generators
# and the stable seed replays. Never reachable from `default` or any
# shipped feature.
arbitrary = [ "dep:arbitrary", "nectar-primitives/arbitrary" ]

# Split-side encrypted mode. Joining encrypted references stays unconditional.
encryption = [ "dep:zeroize", "nectar-primitives/encryption" ]

# Single-thread send escape: relaxes the boxed fetch future off `Send` in
# lockstep with the primitives store traits.
unsync = [
	"nectar-clock/unsync",
	"nectar-governor/unsync",
	"nectar-manifest?/unsync",
	"nectar-marker/unsync",
	"nectar-primitives/unsync",
	"nectar-tasks/unsync",
]

[[bench]]
name = "latency_bench"
harness = false

# `rayon` and `unsync` are mutually exclusive, so the doc build lists
# features explicitly rather than enabling all at once.
[package.metadata.docs.rs]
features = ["tokio", "rayon", "encryption", "arbitrary", "manifest"]
rustdoc-args = ["--cfg", "docsrs"]
