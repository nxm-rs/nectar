[package]
name = "nectar-ldb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
description = "ldb v1 content-addressed key-value database for Ethereum Swarm"
documentation = "https://docs.rs/nectar-ldb"
readme = "README.md"
keywords = ["swarm", "ethereum", "database", "mantaray", "key-value"]
categories = ["data-structures"]

[lints]
workspace = true

[dependencies]
alloy-primitives = { workspace = true }
arbitrary = { workspace = true, optional = true }
bytes.workspace = true
# The walk substrate: the in-flight set the hand-rolled loops admit into and
# the `Stream` trait they poll it through.
futures-util = { workspace = true }
# The manifest seam's shared data-load lane.
nectar-file = { workspace = true, optional = true, features = ["manifest"] }
nectar-governor = { workspace = true }
nectar-manifest = { workspace = true, optional = true }
nectar-primitives = { workspace = true }
nectar-tasks = { workspace = true }
thiserror.workspace = true

[dev-dependencies]
alloy-primitives = { workspace = true }
anyhow.workspace = true
arbitrary.workspace = true
bytes.workspace = true
nectar-file = { workspace = true, features = ["primitives"] }
# Self dev-dependency: exposes `generators` and the manifest seam to tests/.
nectar-ldb = { workspace = true, features = ["arbitrary", "manifest"] }
nectar-manifest.workspace = true
nectar-primitives = { workspace = true, features = ["arbitrary"] }
nectar-testing = { workspace = true, features = ["bench", "fixtures"] }
proptest.workspace = true
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
sha2 = { workspace = true, features = ["std"] }
# `test-util` supplies `start_paused`: the harness reads the cursor's parallel
# rounds off the paused clock rather than guessing them.
tokio = { workspace = true, features = ["time", "test-util"] }

[features]
default = [ "std" ]
# The value-model impls, the `generators` regime builders, the shared codec
# oracle and the stable seed replays. Never reachable from `default` or any
# shipped feature.
arbitrary = [
	"alloy-primitives/arbitrary",
	"dep:arbitrary",
	"nectar-file?/arbitrary",
	"nectar-primitives/arbitrary",
	"std",
]
# Per-reference node encryption (deterministic key derivation, sealing and
# opening). The 64-byte ref representation is always available; this feature
# only adds the crypto over it, so a default build still decodes and
# re-serializes encrypted manifests losslessly. The crypto rides on
# always-available primitives (transcrypt, keccak, the ref types), so it enables
# no primitives feature and drags in no rng: the module is gated purely to keep
# the surface opt-in.
encryption = []
# The shared `Manifest` seam: the folder view as one implementation of it,
# with entry data joined through the file crate's shared load lane. Implies
# `std`.
manifest = [ "dep:nectar-file", "dep:nectar-manifest", "std" ]
std = [
	"alloy-primitives/std",
	"bytes/std",
	"futures-util/std",
	"nectar-manifest?/std",
	"nectar-primitives/std",
	"nectar-tasks/std",
	"thiserror/std",
]
# Single-thread send escape: relaxes the boxed fetch futures off `Send` in
# lockstep with the store traits.
unsync = [
	"nectar-file?/unsync",
	"nectar-governor/unsync",
	"nectar-manifest?/unsync",
	"nectar-primitives/unsync",
	"nectar-tasks/unsync",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# An example, not a bench: a bench target cannot be run for its JSON document.
[[example]]
name = "ldb-perf"
path = "examples/ldb-perf/main.rs"
test = true
