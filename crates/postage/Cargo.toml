[package]
name = "nectar-postage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
description = "The behaviour half of Swarm postage: the stamped put seam and the batch event surface"
documentation = "https://docs.rs/nectar-postage"
readme = "README.md"
keywords = ["swarm", "ethereum", "postage", "no_std"]
categories = ["no-std", "data-structures"]

[lints]
workspace = true

[dependencies]
nectar-postage-primitives = { workspace = true }
nectar-primitives = { workspace = true }

[dev-dependencies]
alloy-primitives = { workspace = true }
arbitrary = { workspace = true }
nectar-postage-primitives = { workspace = true, features = ["arbitrary"] }
nectar-testing = { workspace = true }

[features]
default = [ "std" ]

# Standard library support. Enables events.
std = [ "nectar-postage-primitives/std", "nectar-primitives/std" ]

# Serialization support with serde.
serde = [ "nectar-postage-primitives/serde", "nectar-primitives/serde" ]

# Parallel verification using rayon (sync, CPU-bound).
parallel = [ "nectar-postage-primitives/parallel" ]

# Arbitrary trait implementations and valid-by-construction generators for
# property-based testing and fuzzing.
arbitrary = [
	"nectar-postage-primitives/arbitrary",
	"nectar-primitives/arbitrary",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = [ "--cfg", "docsrs" ]
