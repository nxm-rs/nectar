[package]
name = "nectar-integration-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Allocator-swap probes and reference-client vectors for the nectar workspace"
publish = false

# Non-shipping targets: the runtime-safety restriction set does not apply,
# but stubs and ad-hoc executor entry points stay denied.
[lints.rust]
unused-must-use = "deny"
rust-2018-idioms = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
redundant-clone = "warn"
todo = "deny"
unimplemented = "deny"
disallowed_methods = "deny"

[dev-dependencies]
anyhow.workspace = true
arbitrary.workspace = true
alloy-primitives = { workspace = true, features = ["getrandom"] }
bytes.workspace = true
nectar-file = { workspace = true }
nectar-ldb = { workspace = true, features = ["arbitrary"] }
nectar-manifest.workspace = true
nectar-mantaray = { workspace = true, features = ["manifest"] }
nectar-primitives = { workspace = true, features = ["std"] }
nectar-testing = { workspace = true, features = ["alloc", "fixtures"] }
proptest.workspace = true

[features]
# Each feature mirrors the underlying crate feature so the `cfg(feature)`
# gates in the test files keep their meaning; CI selects the shapes.
encryption = [
	"nectar-file/encryption",
	"nectar-mantaray/encryption",
	"nectar-primitives/encryption",
]
rayon = [ "nectar-file/rayon" ]

[[test]]
name = "file_alloc_probe"
path = "tests/file/alloc_probe.rs"

[[test]]
name = "file_membound"
path = "tests/file/membound.rs"

[[test]]
name = "file_plain_alloc_probe"
path = "tests/file/plain_alloc_probe.rs"

[[test]]
name = "file_split_membound"
path = "tests/file/split_membound.rs"

[[test]]
name = "ldb_membound"
path = "tests/ldb/membound.rs"

[[test]]
name = "mantaray_bmt_nodes"
path = "tests/mantaray/bmt_nodes.rs"

[[test]]
name = "mantaray_bee_layout"
path = "tests/mantaray/bee_layout.rs"

[[test]]
name = "mantaray_bee_vectors"
path = "tests/mantaray/bee_vectors.rs"
