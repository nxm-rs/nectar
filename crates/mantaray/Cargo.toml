[package]
name = "nectar-mantaray"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
description = "Mantaray manifest trie for Ethereum Swarm"
documentation = "https://docs.rs/nectar-mantaray"
readme = "README.md"
keywords = ["swarm", "ethereum", "manifest", "mantaray", "trie"]
categories = ["data-structures"]

[lints]
workspace = true

[dependencies]
alloy-primitives = { workspace = true, features = ["map", "std"] }
bitflags = { workspace = true }
futures-util = { workspace = true, features = ["std"] }
# The manifest seam's shared data-load lane.
nectar-file = { workspace = true, optional = true, features = ["manifest"] }
nectar-governor = { workspace = true }
nectar-manifest = { workspace = true, features = ["std"] }
nectar-primitives = { workspace = true, features = ["std"] }
nectar-tasks = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
arbitrary = { workspace = true, optional = true }
rand = { workspace = true, optional = true }

[dev-dependencies]
arbitrary = { workspace = true }
bytes.workspace = true
criterion.workspace = true
# Registry-pinned legacy oracle for the submission-order differential gate:
# identical op sequences must produce byte-identical roots.
nectar-primitives = { workspace = true, features = ["arbitrary"] }
nectar-testing.workspace = true
proptest.workspace = true
proptest-arbitrary-interop.workspace = true
rand.workspace = true
serde_json.workspace = true

[features]
default = [ "rand" ]
# Random obfuscation-key generation for encrypted manifests.
rand = [ "dep:rand" ]
# Valid-by-construction `arbitrary::Arbitrary` impls for `Node`, `Fork`,
# `Prefix`, `NodeType`, and `ObfuscationKey`, for structured (round-trip)
# fuzz targets.
arbitrary = [
	"alloy-primitives/arbitrary",
	"dep:arbitrary",
	"nectar-file?/arbitrary",
	"nectar-primitives/arbitrary",
]
encryption = [ "nectar-file?/encryption", "nectar-primitives/encryption" ]
# The shared `Manifest` seam: the trie as one implementation of it, with
# entry data joined through the file crate's shared load lane.
manifest = [ "dep:nectar-file" ]
# Raw node internals (the `hazmat` module) for fuzz harnesses and benches.
hazmat = []
# Single-thread send escape: relaxes the boxed trie futures off `Send` in
# lockstep with the store traits.
unsync = [
	"nectar-file?/unsync",
	"nectar-governor/unsync",
	"nectar-manifest/unsync",
	"nectar-primitives/unsync",
	"nectar-tasks/unsync",
]

[[bench]]
name = "mantaray_bench"
harness = false
required-features = ["hazmat", "manifest"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
